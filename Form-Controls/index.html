<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1></h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>T-shirt Order</legend>

          <div>

            <label for="name">Full name</label>
            <input
            tybe="text" id="name" required>

          </div>

          <div>
            <label for="email">Email address</label>
            <input tybe="email" id="email" name="email" required>

          </div>

        </fieldset>

        <fieldset>
          <legend>Colour</legend>
          <div>

            <input type="radio" id="colour-red" name="colour" value="Red" required>
            <label for="colour-red">Red</label>

          </div>

          <div>

            <input type="radio" id="colour-blue" name="colour" value="Blue">
            <label for="colour-blue">Blue</label>
            
          </div>

          <div>

            <input type="radio" id="colour-black" name="colour" value="Black">
            <label for="colour-black">Black</label>
            
          </div>
          </fieldset>

          <div>
            <label for="size">Size</label>
            <select id="size" name="size" required>
              <option value="" disabled selected>Select a size</option>
              <option>XS</option>
              <option>S</option>
              <option>M</option>
              <option>L</option>
              <option>XL</option>
              <option>XXL</option>

            </select>
          </div>

          <Button tybe="submit">Submit</Button>

        </fieldset>
       
      </form>
    </main>
    <footer>
     <p>© 2026 T-shirt shop</p>
    </footer>
  </body>
</html>
